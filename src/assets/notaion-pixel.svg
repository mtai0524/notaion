<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Notaion pixel mark — outline-only retro handheld (pixel take on classic
       line-art gameboy icons): empty screen, cross d-pad, two dot buttons,
       two dashes, clipped bottom-right corner. Single color; ink/paper swap
       keeps the tab icon visible in dark mode.
       Favicon twin of components/pixel/NotaionMark.jsx — keep in sync. -->
  <style>
    .ink { fill: #111827; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fdfcf8; }
    }
  </style>
  <!-- body outline, bottom-right corner cut 45° -->
  <path class="ink" d="M3 0h10v1H3zM2 1h1v14H2zM13 1h1v11h-1zM12 12h1v1h-1zM11 13h1v1h-1zM10 14h1v1h-1zM3 15h7v1H3z"/>
  <!-- screen outline (empty window) -->
  <path class="ink" d="M4 2h8v1H4zM4 3h1v4H4zM11 3h1v4h-1zM4 7h8v1H4z"/>
  <!-- d-pad cross -->
  <path class="ink" d="M5 10h1v3H5zM4 11h3v1H4z"/>
  <!-- A / B dot buttons (diagonal) -->
  <rect class="ink" x="11" y="10" width="1" height="1"/>
  <rect class="ink" x="9" y="11" width="1" height="1"/>
  <!-- start / select dashes -->
  <rect class="ink" x="5" y="13" width="2" height="1"/>
  <rect class="ink" x="8" y="13" width="2" height="1"/>
</svg>
