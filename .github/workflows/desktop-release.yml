# Builds the Notaion Daily desktop app (desktop/) and publishes the Windows
# installer as a GitHub Release. The web /desktop page links to releases/latest.
#
# Release: bump version in desktop/src-tauri/tauri.conf.json, then
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Notaion Daily v__VERSION__
          releaseBody: |
            Tải **Notaion.Daily_*_x64-setup.exe** bên dưới rồi chạy để cài (không cần quyền admin).
            Windows SmartScreen có thể cảnh báo vì app chưa ký số: chọn *More info → Run anyway*.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
